name = "fvvcgen"
defaultTargets = ["Fv1", "Vg"]

[leanOptions]
autoImplicit = false

[[require]]
name = "Kraken"
git = "https://github.com/sgraf812/kraken"
rev = "a4cce2ec6d840376e4dbbf4a11a777ebdf42a3cb"

[[require]]
name = "EthLib"
git = "https://github.com/ethereum/EthLib.git"
rev = "862185680cf23ccf54d44eb25b63b26c5020597b"

# B0: the same EthLib spec files as ../lean, read in place.
[[lean_lib]]
name = "Fv"
srcDir = "../lean"
roots = ["Fv.Spec"]

[[lean_lib]]
name = "Fv1"
srcDir = "../lean"
roots = ["Fv1.SpecScalars", "Fv1.SpecList", "Fv1.Transfer"]

[[lean_lib]]
name = "Vg"

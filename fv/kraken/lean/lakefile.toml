name = "fvkraken"
defaultTargets = ["Spec", "Machine", "Runtime"]

[leanOptions]
autoImplicit = false

[[require]]
name = "Kraken"
git = "https://github.com/AeneasVerif/kraken"
rev = "6064eecbb730a1152aa6ed891a155d3a92a4f298"

[[require]]
name = "EthLib"
git = "https://github.com/ethereum/EthLib.git"
rev = "862185680cf23ccf54d44eb25b63b26c5020597b"

# The shared layer. A library has the modules of one directory (glob `<Name>.+`).
# Spec: EthLib specifications that several types share, and the ones that the description checker imports
# (gen/desc-checker/DescChecker.lean). They import only EthLib and each other.
[[lean_lib]]
name = "Spec"
globs = ["Spec.+"]

# Machine: helpers on the Kraken machine model (steps, frames, bytes, labels, flags), the commands that read
# code and data files (`include_x64_code`, `data_include`) and the witness host tactics. No module of this library
# reads a code or data file itself.
[[lean_lib]]
name = "Machine"
globs = ["Machine.+"]

# Runtime: the contracts of the Go runtime callees and their models. The models are the .S files of
# Runtime/; `include_x64_code` reads them, so they are inputs of the library. A `needs` entry puts the file
# contents into the input hash of every module of the library, so Lake rebuilds the proofs when a .S file changes.
# `Runtime/StaticUint64s.lean` reads the data file staticuint64s.data of link/out (the input_dir test_target_data below).
[[input_dir]]
name = "runtime_lean_S"
path = "Runtime"
text = true
filter = {extension = ["S"]}

[[lean_lib]]
name = "Runtime"
globs = ["Runtime.+"]
needs = ["runtime_lean_S", "test_target_data"]

# The data files of the small Go 1.26.3 test target ELF (link/out). Runtime/StaticUint64s.lean reads staticuint64s.data.
[[input_dir]]
name = "test_target_data"
path = "../link/out/data"
text = true

# Codec: lemmas that do not depend on one Prysm type: the uint64 decoder pattern, the fixed-bytes field
# patterns, segment and loop lemmas (Codec/Segment/), the statement kinds of the generated proofs (Codec/Kind/)
# and the encoder step lemmas. No module of this library reads a code or data file itself. Codec and Prysm import
# each other at module level: 25 of the 60 Codec modules import a Prysm module (13 of 36 in Codec/, 2 of 11 in
# Codec/Kind/, 10 of 13 in Codec/Segment/), and 211 of the 673 Prysm modules import a Codec module.
[[lean_lib]]
name = "Codec"
globs = ["Codec.+"]

# The one link set of the Prysm target, prysm/go1.26.10/link-set (the code and data of the Go 1.26.10 ELF that the
# theorems read): its .S files and data files are inputs of every module of the Prysm library.
[[input_dir]]
name = "prysm_target_norm_S"
path = "../prysm/go1.26.10/link-set/norm"
text = true
filter = {extension = ["S"]}

[[input_dir]]
name = "prysm_target_data"
path = "../prysm/go1.26.10/link-set/data"
text = true

# witness-only runtime model: the 72-byte bump newobject Prysm/AttestationData/BumpNewobject72.S
[[input_dir]]
name = "attestation_data_runtime_model_S"
path = "Prysm/AttestationData"
text = true
filter = {extension = ["S"]}

# Prysm: one directory for each Prysm type (Prysm/<GoTypeName>/) and the ELF data of the link set
# (Prysm/ElfData/). Not a default target.
[[lean_lib]]
name = "Prysm"
globs = ["Prysm.+"]
needs = ["prysm_target_norm_S", "prysm_target_data", "attestation_data_runtime_model_S", "runtime_model_S", "deposit_lean_S"]

# witness-only runtime models of the Prysm library: the type-dispatching bump allocators Prysm/RuntimeModel/*.S
[[input_dir]]
name = "runtime_model_S"
path = "Prysm/RuntimeModel"
text = true
filter = {extension = ["S"]}

# witness-only runtime model of the Deposit witness: the 120-byte bump newobject Prysm/Deposit/BumpNewobject120.S
[[input_dir]]
name = "deposit_lean_S"
path = "Prysm/Deposit"
text = true
filter = {extension = ["S"]}

name = "fvkraken"
defaultTargets = ["Spec", "Machine", "Runtime", "TestTarget"]

[leanOptions]
autoImplicit = false

[[require]]
name = "Kraken"
git = "https://github.com/AeneasVerif/kraken"
rev = "6064eecbb730a1152aa6ed891a155d3a92a4f298"

[[require]]
name = "EthLib"
git = "https://github.com/ethereum/EthLib.git"
rev = "862185680cf23ccf54d44eb25b63b26c5020597b"

# The shared layer. A library has the modules of one directory (glob `<Name>.+`).
# Spec: EthLib specifications that several types share, and the ones that the description checker imports
# (gen/desccheck/DescCheck.lean). They import only EthLib and each other.
[[lean_lib]]
name = "Spec"
globs = ["Spec.+"]

# Machine: helpers on the Kraken machine model (steps, frames, bytes, labels, flags), the commands that read
# code and data files (`include_x64_rt`, `data_include`) and the witness host tactics. No module of this library
# reads a code or data file itself.
[[lean_lib]]
name = "Machine"
globs = ["Machine.+"]

# Runtime: the contracts of the Go runtime callees and their models. The models are the .S files of
# Runtime/; `include_x64_rt` reads them, so they are inputs of the library (Rebuild tracking: con-agua
# ConAgua/AsmFile/Include.lean; a `needs` entry puts the file contents into the input hash of every module of
# the library, so Lake rebuilds the proofs when a .S file changes).
[[input_dir]]
name = "runtime_lean_S"
path = "Runtime"
text = true
filter = {extension = ["S"]}

[[lean_lib]]
name = "Runtime"
globs = ["Runtime.+"]
needs = ["runtime_lean_S"]

# TestTarget: proofs and code of the small Go 1.26.3 test target ELF (link/out) that the Prysm proofs reuse.
# The converted .S files and the data files of link/out are inputs of the library.
[[input_dir]]
name = "test_target_norm_S"
path = "../link/out/norm"
text = true

[[input_dir]]
name = "test_target_data"
path = "../link/out/data"
text = true

[[lean_lib]]
name = "TestTarget"
globs = ["TestTarget.+"]
needs = ["test_target_norm_S", "test_target_data"]

# Codec: lemmas that do not depend on one Prysm type: the uint64 decoder pattern, the fixed-bytes field
# patterns, segment and loop lemmas (Codec/Segment/), the statement kinds of the generated proofs (Codec/Kind/)
# and the encoder step lemmas. No module of this library reads a code or data file itself. Some modules of
# Codec/Segment/ import modules of the Prysm and E2eHb libraries.
[[lean_lib]]
name = "Codec"
globs = ["Codec.+"]

# Prysm: one directory for each Prysm type (Prysm/<GoTypeName>/), the ELF data of the link sets (Prysm/ElfData/).
# Now: v1alpha1.Checkpoint (decoder, encoder, SizeSSZ) and primitives.Epoch (decoder) on the Go 1.26.10 ELF, link set
# prysm/go1.26.10/e2e/link. Not a default target. The .S and data files of that link set are inputs of every module.
[[input_dir]]
name = "e2e_norm_S"
path = "../prysm/go1.26.10/e2e/link/norm"
text = true

[[input_dir]]
name = "e2e_data"
path = "../prysm/go1.26.10/e2e/link/data"
text = true

# The link set prysm/go1.26.10/e2e/ad/link (v1alpha1.AttestationData and the primitives.Slot and CommitteeIndex
# decoders on the same Go 1.26.10 ELF) and the witness-only runtime model Prysm/AttestationData/BumpNew72.S are
# inputs of the Prysm library too.
[[input_dir]]
name = "e2e_ad_norm_S"
path = "../prysm/go1.26.10/e2e/ad/link/norm"
text = true

[[input_dir]]
name = "e2e_ad_data"
path = "../prysm/go1.26.10/e2e/ad/link/data"
text = true

# witness-only runtime model: the 72-byte bump newobject Prysm/AttestationData/BumpNew72.S
[[input_dir]]
name = "e2e_ad_lean_S"
path = "Prysm/AttestationData"
text = true
filter = {extension = ["S"]}

[[lean_lib]]
name = "Prysm"
globs = ["Prysm.+"]
needs = ["e2e_norm_S", "e2e_data", "e2e_ad_norm_S", "e2e_ad_data", "e2e_ad_lean_S", "lv_norm_S",
  "lv_data", "lv_t3_norm_S", "lv_t3_data", "runtime_model_S"]

# Generated and hand proofs of the flat fixed-size types: their segment instances, accept and reject theorems,
# witnesses and specifications. The parameterized lemmas that they use are in Codec. Build one module at a time.
[[lean_lib]]
name = "E2eScal"
globs = ["E2eScal.+"]
needs = ["e2e_norm_S", "e2e_data", "e2e_ad_norm_S", "e2e_ad_data", "e2e_ad_lean_S"]

# Link sets of the list and vector types on the same Go 1.26.10 ELF: lv/link (SyncAggregate and SyncCommittee
# decoders) and lv/link-t3 (IndexedAttestation decoder). Inputs of the Prysm modules that read them
# (Prysm/SyncAggregate/, Prysm/SyncCommittee/, Prysm/IndexedAttestation/, Prysm/ElfData/) and of the libraries below.
[[input_dir]]
name = "lv_norm_S"
path = "../prysm/go1.26.10/e2e/lv/link/norm"
text = true

[[input_dir]]
name = "lv_data"
path = "../prysm/go1.26.10/e2e/lv/link/data"
text = true

# IndexedAttestation: the link set lv/link-t3 (after the conv.py fix that writes a negative 32-bit displacement in signed form)
[[input_dir]]
name = "lv_t3_norm_S"
path = "../prysm/go1.26.10/e2e/lv/link-t3/norm"
text = true

[[input_dir]]
name = "lv_t3_data"
path = "../prysm/go1.26.10/e2e/lv/link-t3/data"
text = true

# witness-only runtime models of the Prysm library: the type-dispatching bump allocators Prysm/RuntimeModel/*.S
[[input_dir]]
name = "runtime_model_S"
path = "Prysm/RuntimeModel"
text = true
filter = {extension = ["S"]}

# Port of the SyncCommittee proof to the real v1alpha1.HistoricalBatch decoder (same Go 1.26.10 ELF).
# Own library; it imports the SyncCommittee modules of Prysm and does not change them. The .S file of prysm/go1.26.10/e2e/lv/link-hb is an input.
[[input_dir]]
name = "lv_hb_norm_S"
path = "../prysm/go1.26.10/e2e/lv/link-hb/norm"
text = true

[[lean_lib]]
name = "E2eHb"
globs = ["E2eHb.+"]
needs = ["e2e_norm_S", "e2e_data", "e2e_ad_norm_S", "e2e_ad_data", "e2e_ad_lean_S", "lv_norm_S", "lv_data",
  "lv_t3_norm_S", "lv_t3_data", "lv_hb_norm_S"]

# Proof of use: the real v1alpha1.Deposit decoder, proved with the general lemmas of Codec/Segment/.
[[input_dir]]
name = "lv_dep_norm_S"
path = "../prysm/go1.26.10/e2e/lv/link-dep/norm"
text = true

[[input_dir]]
name = "lv_dep_data"
path = "../prysm/go1.26.10/e2e/lv/link-dep/data"
text = true

[[lean_lib]]
name = "E2eDep"
globs = ["E2eDep.+"]
needs = ["e2e_norm_S", "e2e_data", "e2e_ad_norm_S", "e2e_ad_data", "e2e_ad_lean_S", "lv_norm_S", "lv_data",
  "lv_t3_norm_S", "lv_t3_data", "lv_hb_norm_S", "lv_dep_norm_S", "lv_dep_data"]

# Deposit witnesses and their runtime model (the 120-byte bump newobject E2eDepW/BumpNew120.S)
[[input_dir]]
name = "lv_dep_lean_S"
path = "E2eDepW"
text = true
filter = {extension = ["S"]}

[[lean_lib]]
name = "E2eDepW"
globs = ["E2eDepW.+"]
needs = ["e2e_norm_S", "e2e_data", "e2e_ad_norm_S", "e2e_ad_data", "e2e_ad_lean_S", "lv_norm_S", "lv_data",
  "lv_t3_norm_S", "lv_t3_data", "lv_hb_norm_S", "lv_dep_norm_S", "lv_dep_data", "lv_dep_lean_S"]

# First variable-length encoder hand proof: real v1alpha1.DataColumnsByRootIdentifier.MarshalSSZTo on
# the same Go 1.26.10 ELF. Own library: the Prysm / E2eScal modules do not change. Build one module
# at a time, e.g. `lake build E2eEnc.StmtEnc`. The .S files of prysm/go1.26.10/e2e/lv/link-enc are inputs.
[[input_dir]]
name = "enc_norm_S"
path = "../prysm/go1.26.10/e2e/lv/link-enc/norm"
text = true

[[lean_lib]]
name = "E2eEnc"
globs = ["E2eEnc.+"]
needs = ["e2e_norm_S", "e2e_data", "e2e_ad_norm_S", "e2e_ad_data", "e2e_ad_lean_S", "lv_norm_S", "lv_data",
  "lv_t3_norm_S", "lv_t3_data", "enc_norm_S"]

# Round trip: the real v1alpha1.DataColumnsByRootIdentifier.UnmarshalSSZ (link set lv/link-dec), the witness-only
# runtime models of this library (E2eDec/*.S) and the decoder→encoder composition. Own library: no other module changes.
[[input_dir]]
name = "dcd_norm_S"
path = "../prysm/go1.26.10/e2e/lv/link-dec/norm"
text = true

[[input_dir]]
name = "dcd_data"
path = "../prysm/go1.26.10/e2e/lv/link-dec/data"
text = true

[[input_dir]]
name = "dcd_lean_S"
path = "E2eDec"
text = true
filter = {extension = ["S"]}

[[lean_lib]]
name = "E2eDec"
globs = ["E2eDec.+"]
needs = ["e2e_norm_S", "e2e_data", "e2e_ad_norm_S", "e2e_ad_data", "e2e_ad_lean_S", "lv_norm_S", "lv_data",
  "lv_t3_norm_S", "lv_t3_data", "enc_norm_S", "dcd_norm_S", "dcd_data", "dcd_lean_S"]
